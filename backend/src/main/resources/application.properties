spring.application.name=backend

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_pos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Logging =====
# Log levels controlled in logback-spring.xml
# Override here only if needed:
# logging.level.com.restaurantpos.backend=DEBUG

# Log file location (overrides logback default)
logging.file.path=${LOG_DIR:logs}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ===== File Storage =====
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-mb=${UPLOAD_MAX_SIZE_MB:5}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Razorpay Configuration
# ===============================
# Razorpay (TEST MODE - coworker's account, temporary)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ========== Email (Gmail SMTP) ==========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender details
app.mail.from-email=${MAIL_USERNAME}
app.mail.from-name=Restaurant POS

# Platform settings
app.settings.trial-days=7
app.settings.grace-days=3
app.settings.default-plan=BASIC
app.settings.timezone=Asia/Kolkata
app.settings.auto-suspend=true
app.settings.razorpay-webhooks=true
app.settings.allow-registration=true
app.settings.maintenance-mode=false
app.settings.session-timeout-minutes=30
app.settings.strong-passwords=true
app.settings.ip-logging=true
app.settings.currency=INR
app.settings.gst-enabled=true
app.settings.alert.trial-expiry=true
app.settings.alert.new-tenant=true
app.settings.alert.payment-failure=true
app.settings.alert.daily-digest=false
app.settings.alert.email=jyotiranjanjenapintu@gmail.com
